<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Табло бара НА ДНЕ</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0808;
            --blood-red: #d11100;
            --dirty-yellow: #e5a910;
            --text-light: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(209, 17, 0, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 10% 80%, rgba(229, 169, 16, 0.05) 0%, transparent 40%);
            color: var(--text-light);
            font-family: 'Permanent Marker', cursive;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 60px;
            overflow: hidden;
            position: relative;
        }

        .header { text-align: center; margin-bottom: 50px; transform: rotate(-2deg); }
        .header h1 {
            font-size: 6rem; color: #fff; text-transform: uppercase; letter-spacing: 5px;
            text-shadow: 0 0 10px var(--blood-red), 0 0 20px var(--blood-red), 0 0 40px var(--blood-red);
            animation: neonFlicker 3s infinite alternate;
        }
        .header .subtitle {
            font-family: 'VT323', monospace; font-size: 2rem; color: var(--dirty-yellow);
            background: #000; display: inline-block; padding: 0 15px; transform: rotate(3deg);
            border: 1px solid var(--dirty-yellow);
        }

        @keyframes neonFlicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }

        .board { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 25px; }

        .card {
            background: #151515; border: 3px solid #333; padding: 15px 30px;
            display: grid; grid-template-columns: 80px 1fr auto; align-items: center;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.8); position: relative; transition: all 0.3s ease;
        }
        .card:nth-child(odd) { transform: rotate(-1.5deg); }
        .card:nth-child(even) { transform: rotate(1.5deg); }

        .card.rank-1 { border-color: var(--dirty-yellow); background: #2a1f00; }
        .card.rank-1 .rank { color: var(--dirty-yellow); }

        .rank { font-size: 3rem; color: #555; }
        .name-container { display: flex; flex-direction: column; justify-content: center; }
        .name { font-size: 2.5rem; color: #eee; }
        
        /* Блок статистики бомб */
        .battle-stats {
            font-family: 'VT323', monospace;
            font-size: 1.4rem;
            color: #ffaa00;
            display: flex;
            gap: 15px;
            margin-top: 2px;
        }

        .score-box { text-align: right; background: #000; padding: 10px; border: 2px dashed #444; }
        .score { font-family: 'VT323', monospace; font-size: 3.5rem; color: var(--blood-red); }
        .unit { font-family: 'VT323', monospace; font-size: 1.5rem; color: #777; }

        /* ОКНО БАТТЛА И ПОБЕДЫ */
        #battle-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 0, 0, 0.95);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; text-align: center;
            border: 15px solid var(--blood-red);
            animation: warningPulse 0.5s infinite alternate;
        }

        @keyframes warningPulse {
            0% { border-color: var(--blood-red); box-shadow: inset 0 0 50px var(--blood-red); }
            100% { border-color: var(--dirty-yellow); box-shadow: inset 0 0 100px var(--dirty-yellow); }
        }

        .battle-title { font-size: 4rem; color: var(--dirty-yellow); text-shadow: 0 0 20px red; }
        .battle-versus { font-size: 5rem; color: #fff; margin: 20px 0; }
        .battle-status { font-family: 'VT323', monospace; font-size: 3rem; color: #00f0ff; }

        .winner-mode {
            border-color: var(--dirty-yellow) !important;
            background: radial-gradient(circle, rgba(229,169,16,0.3) 0%, rgba(0,0,0,0.95) 100%) !important;
        }
        .winner-name {
            font-size: 6rem !important;
            color: var(--dirty-yellow) !important;
            text-shadow: 0 0 30px var(--dirty-yellow), 0 0 60px red !important;
            animation: winnerZoom 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite alternate;
        }

        @keyframes winnerZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>НА ДНЕ</h1>
        <div class="subtitle">Minsk Shot Bar</div>
    </div>

    <div class="board" id="board"></div>

    <div id="battle-overlay">
        <div class="battle-title" id="b-title">🚨 ВЫЗОВ НА БАТТЛ! 🚨</div>
        <div class="battle-versus" id="b-vs">ИГРОК 1 💣 ИГРОК 2</div>
        <div class="battle-status" id="b-status">ЖДЕМ ПОДТВЕРЖДЕНИЯ В TELEGRAM...</div>
    </div>

    <script>
        const socket = io();
        const board = document.getElementById('board');
        const overlay = document.getElementById('battle-overlay');
        const bTitle = document.getElementById('b-title');
        const bVs = document.getElementById('b-vs');
        const bStatus = document.getElementById('b-status');

        async function updateLeaderboard() {
            try {
                const res = await fetch('/api/leaderboard');
                const guests = await res.json();

                guests.forEach((guest, index) => {
                    const rank = index + 1;
                    let card = document.getElementById(`guest-${guest.id}`);

                    const bombsCount = guest.bombs || 0;
                    const winsCount = guest.wins || 0;
                    const battleBadge = bombsCount > 0 
                        ? `💣 ${bombsCount} ${winsCount > 0 ? `| 👑 ${winsCount} ПОБЕД` : ''}`
                        : '';

                    if (!card) {
                        card = document.createElement('div');
                        card.id = `guest-${guest.id}`;
                        card.className = `card rank-${rank <= 3 ? rank : 'other'}`;
                        card.innerHTML = `
                            <div class="rank">#${rank}</div>
                            <div class="name-container">
                                <div class="name">${guest.name}</div>
                                <div class="battle-stats" id="b-stats-${guest.id}">${battleBadge}</div>
                            </div>
                            <div class="score-box">
                                <span class="score" id="score-${guest.id}">${guest.count}</span>
                                <span class="unit">ШОТОВ</span>
                            </div>
                        `;
                        board.appendChild(card);
                    } else {
                        document.getElementById(`score-${guest.id}`).innerText = guest.count;
                        document.getElementById(`b-stats-${guest.id}`).innerText = battleBadge;
                    }

                    card.className = `card rank-${rank <= 3 ? rank : 'other'}`;
                    card.querySelector('.rank').innerText = `#${rank}`;
                    board.appendChild(card);
                });
            } catch (e) { console.error(e); }
        }

        updateLeaderboard();
        socket.on('update_board', updateLeaderboard);

        socket.on('battle_announced', (data) => {
            overlay.classList.remove('winner-mode');
            bTitle.innerText = "💣 ВЫЗОВ НА БАТТЛ «БОМБА»! 💣";
            bVs.innerText = `${data.challengerName} ⚔️ ${data.targetName}`;
            bStatus.innerText = "ОЖИДАНИЕ ПОДТВЕРЖДЕНИЯ В TELEGRAM...";
            overlay.style.display = 'flex';
        });

        socket.on('battle_accepted', (data) => {
            overlay.classList.remove('winner-mode');
            bTitle.innerText = "🔥 БАТТЛ ПРИНЯТ! 🔥";
            bVs.innerText = `${data.challengerName} VS ${data.targetName}`;
            bStatus.innerText = "БАРМЕН, ГОТОВЬ БОМБЫ! ВСЕ К СТОЙКЕ!";
        });

        socket.on('battle_declined', (data) => {
            bTitle.innerText = "🐔 СОПЕРНИК СЛИЛСЯ! 🐔";
            bVs.innerText = `${data.targetName} зассал вызова`;
            bStatus.innerText = "ОТМЕНА ДУЭЛИ";
            setTimeout(() => { overlay.style.display = 'none'; }, 4000);
        });

        socket.on('battle_winner_announcement', (data) => {
            overlay.classList.add('winner-mode');
            bTitle.innerText = "👑 ПОБЕДИТЕЛЬ БАТТЛА! 👑";
            bVs.className = "battle-versus winner-name";
            bVs.innerText = data.winnerName;
            bStatus.innerText = "💣 +1 БОМБА И 👑 ПОБЕДА ЗАЧИСЛЕНЫ!";
            
            setTimeout(() => {
                overlay.style.display = 'none';
                overlay.classList.remove('winner-mode');
                bVs.className = "battle-versus";
            }, 7000);
        });
    </script>
</body>
</html>
