<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Табло бара НА ДНЕ</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0808;
            --blood-red: #e61200;
            --dirty-yellow: #e5a910;
            --text-light: #e0e0e0;
            --card-bg: #151515;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 25%, rgba(230, 18, 0, 0.22) 0%, transparent 65%),
                radial-gradient(circle at 10% 80%, rgba(229, 169, 16, 0.08) 0%, transparent 40%);
            color: var(--text-light);
            font-family: 'Russo One', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 35px 50px 140px 50px;
            overflow: hidden;
            position: relative;
        }

        .header { text-align: center; margin-bottom: 35px; }
        .header h1 {
            font-family: 'Russo One', sans-serif; font-size: 6.5rem; color: #ffffff;
            text-transform: uppercase; letter-spacing: 12px; margin-left: 12px; line-height: 1;
            text-shadow: 0 0 5px #fff, 0 0 20px var(--blood-red), 0 0 40px var(--blood-red);
            animation: neonPulse 3.5s infinite alternate;
        }
        .header .subtitle {
            font-family: 'VT323', monospace; font-size: 2.2rem; color: var(--dirty-yellow);
            letter-spacing: 4px; background: #000; padding: 4px 20px; border: 2px solid var(--dirty-yellow);
        }

        @keyframes neonPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.88; }
        }

        .board { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 20px; }

        .card {
            background: var(--card-bg); border: 3px solid #333; padding: 15px 30px;
            display: grid; grid-template-columns: 80px 1fr auto; align-items: center;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.8); position: relative; transition: all 0.3s ease;
        }
        .card:nth-child(odd) { transform: rotate(-0.8deg); }
        .card:nth-child(even) { transform: rotate(0.8deg); }

        .card.rank-1 { border-color: var(--dirty-yellow); background: #2a1f00; }
        .card.rank-1 .rank { color: var(--dirty-yellow); }

        .rank { font-size: 2.8rem; color: #555; }
        .name-container { display: flex; flex-direction: column; justify-content: center; }
        .name { font-size: 2.3rem; color: #eee; }
        
        .battle-stats {
            font-family: 'VT323', monospace; font-size: 1.4rem; color: #ffaa00; display: flex; gap: 15px; margin-top: 2px;
        }

        .score-box { text-align: right; background: #000; padding: 8px 15px; border: 2px dashed #444; }
        .score { font-family: 'VT323', monospace; font-size: 3.2rem; color: var(--blood-red); }
        .unit { font-family: 'VT323', monospace; font-size: 1.3rem; color: #777; }

        /* ИНТЕРАКТИВНЫЙ БАРНЫЙ ЧАТ НА ЭКРАНЕ ТВ */
        #tv-chat-container {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
            z-index: 8000;
        }

        .chat-bubble {
            background: rgba(18, 12, 12, 0.95);
            border: 2px solid var(--dirty-yellow);
            box-shadow: 0 0 25px rgba(229, 169, 16, 0.4), 5px 5px 0 #000;
            border-radius: 12px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            animation: bubblePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: all 0.5s ease;
        }

        @keyframes bubblePop {
            0% { transform: translateY(40px) scale(0.8); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .chat-sender {
            font-family: 'Russo One', sans-serif;
            font-size: 1.6rem;
            color: var(--dirty-yellow);
            background: #000;
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid #444;
            white-space: nowrap;
        }

        .chat-text {
            font-family: 'Russo One', sans-serif;
            font-size: 1.8rem;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            word-break: break-word;
        }

        /* ОВЕРЛЕЙ БАТТЛА */
        #battle-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 2, 2, 0.92); backdrop-filter: blur(8px);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; padding: 20px;
        }

        .battle-card {
            background: #111; border: 4px solid var(--blood-red);
            box-shadow: 0 0 50px rgba(209, 17, 0, 0.6); border-radius: 20px;
            padding: 40px 60px; max-width: 900px; width: 90%; text-align: center;
            display: flex; flex-direction: column; align-items: center;
        }

        .battle-badge {
            background: var(--blood-red); color: #fff; font-size: 1.8rem;
            padding: 8px 25px; border-radius: 50px; margin-bottom: 25px;
        }

        .versus-container { display: flex; align-items: center; justify-content: center; gap: 25px; width: 100%; margin: 20px 0 30px 0; }
        .player-box { background: #1a1a1a; border: 2px solid #333; border-radius: 12px; padding: 20px; flex: 1; max-width: 350px; }
        .player-name { font-size: 2.8rem; color: #fff; }
        .vs-circle { background: var(--dirty-yellow); color: #000; font-size: 2.2rem; width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .battle-status-box { background: #000; border: 1px dashed var(--dirty-yellow); padding: 12px 30px; border-radius: 8px; }
        .battle-status-text { font-family: 'VT323', monospace; font-size: 2.2rem; color: var(--dirty-yellow); }

        .winner-card { border-color: var(--dirty-yellow) !important; box-shadow: 0 0 60px rgba(229, 169, 16, 0.7) !important; }
        .winner-badge { background: var(--dirty-yellow) !important; color: #000 !important; }
        .winner-name-single { font-size: 4.5rem; color: var(--dirty-yellow); text-shadow: 0 0 25px var(--dirty-yellow); margin: 15px 0; }
    </style>
</head>
<body>

    <div class="header">
        <h1>НА ДНЕ</h1>
        <div class="subtitle">Minsk Shot Bar</div>
    </div>

    <div class="board" id="board"></div>

    <!-- ВСПЛЫВАЮЩИЙ ЧАТ НА ЭКРАНЕ ТВ -->
    <div id="tv-chat-container"></div>

    <!-- ВСПЛЫВАЮЩЕЕ ОКНО БАТТЛА -->
    <div id="battle-overlay">
        <div class="battle-card" id="b-card">
            <div class="battle-badge" id="b-badge">💣 ВЫЗОВ НА БАТТЛ «БОМБА» 💣</div>
            
            <div class="versus-container" id="b-vs-box">
                <div class="player-box"><div class="player-name" id="p1-name">ИГРОК 1</div></div>
                <div class="vs-circle">VS</div>
                <div class="player-box"><div class="player-name" id="p2-name">ИГРОК 2</div></div>
            </div>

            <div class="winner-name-single" id="winner-single" style="display: none;"></div>

            <div class="battle-status-box">
                <div class="battle-status-text" id="b-status">ОЖИДАНИЕ ПОДТВЕРЖДЕНИЯ В TELEGRAM...</div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const board = document.getElementById('board');
        const overlay = document.getElementById('battle-overlay');
        const bCard = document.getElementById('b-card');
        const bBadge = document.getElementById('b-badge');
        const bVsBox = document.getElementById('b-vs-box');
        const p1Name = document.getElementById('p1-name');
        const p2Name = document.getElementById('p2-name');
        const winnerSingle = document.getElementById('winner-single');
        const bStatus = document.getElementById('b-status');
        const chatContainer = document.getElementById('tv-chat-container');

        async function updateLeaderboard() {
            try {
                const res = await fetch('/api/leaderboard');
                const guests = await res.json();

                guests.forEach((guest, index) => {
                    const rank = index + 1;
                    let card = document.getElementById(`guest-${guest.id}`);

                    const bombsCount = guest.bombs || 0;
                    const winsCount = guest.wins || 0;
                    const battleBadge = bombsCount > 0 
                        ? `💣 ${bombsCount} ${winsCount > 0 ? `| 👑 ${winsCount} ПОБЕД` : ''}`
                        : '';

                    if (!card) {
                        card = document.createElement('div');
                        card.id = `guest-${guest.id}`;
                        card.className = `card rank-${rank <= 3 ? rank : 'other'}`;
                        card.innerHTML = `
                            <div class="rank">#${rank}</div>
                            <div class="name-container">
                                <div class="name">${guest.name}</div>
                                <div class="battle-stats" id="b-stats-${guest.id}">${battleBadge}</div>
                            </div>
                            <div class="score-box">
                                <span class="score" id="score-${guest.id}">${guest.count}</span>
                                <span class="unit">ШОТОВ</span>
                            </div>
                        `;
                        board.appendChild(card);
                    } else {
                        document.getElementById(`score-${guest.id}`).innerText = guest.count;
                        document.getElementById(`b-stats-${guest.id}`).innerText = battleBadge;
                    }

                    card.className = `card rank-${rank <= 3 ? rank : 'other'}`;
                    card.querySelector('.rank').innerText = `#${rank}`;
                    board.appendChild(card);
                });
            } catch (e) { console.error(e); }
        }

        updateLeaderboard();
        socket.on('update_board', updateLeaderboard);

        // Обработка сообщений барного чата
        socket.on('tv_chat_message', (data) => {
            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble';
            bubble.innerHTML = `
                <div class="chat-sender">💬 ${data.sender}:</div>
                <div class="chat-text">${data.text}</div>
            `;
            
            chatContainer.appendChild(bubble);

            // Держим не более 3 сообщений одновременно
            if (chatContainer.children.length > 3) {
                chatContainer.removeChild(chatContainer.children[0]);
            }

            // Через 12 секунд плавно скрываем сообщение
            setTimeout(() => {
                bubble.style.opacity = '0';
                bubble.style.transform = 'translateY(-20px)';
                setTimeout(() => bubble.remove(), 500);
            }, 12000);
        });

        // Баттлы
        socket.on('battle_announced', (data) => {
            bCard.className = "battle-card";
            bBadge.className = "battle-badge";
            bBadge.innerText = "💣 ВЫЗОВ НА БАТТЛ «БОМБА» 💣";
            bVsBox.style.display = "flex";
            winnerSingle.style.display = "none";
            p1Name.innerText = data.challengerName;
            p2Name.innerText = data.targetName;
            bStatus.innerText = "ЖДЁМ ПОДТВЕРЖДЕНИЯ В TELEGRAM...";
            overlay.style.display = 'flex';
        });

        socket.on('battle_accepted', (data) => {
            bBadge.innerText = "🔥 БАТТЛ ПРИНЯТ! 🔥";
            bStatus.innerText = "БАРМЕН, ГОТОВЬ БОМБЫ! ВСЕ К СТОЙКЕ!";
        });

        socket.on('battle_declined', (data) => {
            bBadge.innerText = "🐔 ВЫЗОВ ОТКЛОНЁН 🐔";
            bStatus.innerText = `${data.targetName} зассал(а) принимать вызов!`;
            setTimeout(() => { overlay.style.display = 'none'; }, 4000);
        });

        socket.on('battle_winner_announcement', (data) => {
            bCard.className = "battle-card winner-card";
            bBadge.className = "battle-badge winner-badge";
            bBadge.innerText = "👑 ПОБЕДИТЕЛЬ БАТТЛА 👑";
            bVsBox.style.display = "none";
            winnerSingle.style.display = "block";
            winnerSingle.innerText = data.winnerName;
            bStatus.innerText = "💣 +1 БОМБА И 👑 ПОБЕДА ЗАЧИСЛЕНЫ!";
            setTimeout(() => { overlay.style.display = 'none'; }, 7000);
        });
    </script>
</body>
</html>
