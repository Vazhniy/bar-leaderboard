<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar TV Leaderboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Montserrat:wght@600;800;900&display=swap');

        :root {
            --bg-dark: #07060b;
            --neon-pink: #ff0055;
            --neon-cyan: #00f0ff;
            --gold: #ffaa00;
            --silver: #d1d5db;
            --bronze: #cd7f32;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 0, 85, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.12) 0%, transparent 40%);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 60px;
            overflow: hidden;
        }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 6px;
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink);
            text-transform: uppercase;
        }
        .header .subtitle {
            font-size: 1.3rem;
            color: var(--neon-cyan);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 8px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .board {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .card {
            background: rgba(20, 18, 28, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 22px 35px;
            display: grid;
            grid-template-columns: 90px 1fr 200px;
            align-items: center;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transition: all 0.5s ease;
        }

        .card.rank-1 { border-color: rgba(255, 170, 0, 0.5); box-shadow: 0 0 30px rgba(255, 170, 0, 0.25); }
        .card.rank-1 .rank { color: var(--gold); text-shadow: 0 0 15px var(--gold); }

        .card.rank-2 { border-color: rgba(209, 213, 219, 0.4); }
        .card.rank-2 .rank { color: var(--silver); }

        .card.rank-3 { border-color: rgba(205, 127, 50, 0.4); }
        .card.rank-3 .rank { color: var(--bronze); }

        .rank { font-family: 'Orbitron', sans-serif; font-size: 2.6rem; font-weight: 900; color: #555; }
        .name { font-size: 2.2rem; font-weight: 800; }
        .score-box { text-align: right; font-family: 'Orbitron', sans-serif; }
        .score { font-size: 3rem; font-weight: 900; color: var(--neon-cyan); text-shadow: 0 0 20px rgba(0, 240, 255, 0.6); }
        .unit { font-size: 1rem; color: #888; font-family: 'Montserrat', sans-serif; margin-left: 8px; text-transform: uppercase; }

        @keyframes bump {
            0% { transform: scale(1); }
            50% { transform: scale(1.35); color: var(--neon-pink); }
            100% { transform: scale(1); }
        }
        .pulse { animation: bump 0.5s ease-out; }
    </style>
</head>
<body>

    <div class="header">
        <h1>SHOTS LEADERBOARD</h1>
        <div class="subtitle">Главные герои вечера</div>
    </div>

    <div class="board" id="board">
        <!-- Список заполнится автоматически -->
    </div>

    <script>
        const socket = io();
        const board = document.getElementById('board');

        async function updateLeaderboard() {
            try {
                const res = await fetch('/api/leaderboard');
                const guests = await res.json();

                guests.forEach((guest, index) => {
                    const rank = index + 1;
                    let card = document.getElementById(`guest-${guest.id}`);

                    if (!card) {
                        card = document.createElement('div');
                        card.id = `guest-${guest.id}`;
                        card.className = `card rank-${rank <= 3 ? rank : 'other'}`;
                        card.innerHTML = `
                            <div class="rank">#${rank}</div>
                            <div class="name">${guest.name}</div>
                            <div class="score-box">
                                <span class="score" id="score-${guest.id}">${guest.count}</span>
                                <span class="unit">шотов</span>
                            </div>
                        `;
                        board.appendChild(card);
                    } else {
                        const scoreEl = document.getElementById(`score-${guest.id}`);
                        if (parseInt(scoreEl.innerText) !== guest.count) {
                            scoreEl.innerText = guest.count;
                            scoreEl.classList.remove('pulse');
                            void scoreEl.offsetWidth;
                            scoreEl.classList.add('pulse');
                        }
                    }

                    card.className = `card rank-${rank <= 3 ? rank : 'other'}`;
                    card.querySelector('.rank').innerText = `#${rank}`;
                    board.appendChild(card);
                });

                const currentIds = guests.map(g => `guest-${g.id}`);
                Array.from(board.children).forEach(child => {
                    if (!currentIds.includes(child.id)) child.remove();
                });

            } catch (e) {
                console.error("Ошибка загрузки:", e);
            }
        }

        updateLeaderboard();

        socket.on('update_board', () => {
            updateLeaderboard();
        });
    </script>
</body>
</html>
