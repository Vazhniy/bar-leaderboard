<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Табло бара НА ДНЕ</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Russo+One&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080606;
            --blood-red: #ff1100;
            --deep-red: #880000;
            --dirty-yellow: #ffb700;
            --text-light: #f0f0f0;
            --card-bg: #141212;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'VT323', monospace; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 18%, rgba(255, 17, 0, 0.28) 0%, transparent 60%),
                radial-gradient(circle at 10% 85%, rgba(255, 183, 0, 0.08) 0%, transparent 45%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 25px 40px 120px 40px; overflow: hidden; position: relative;
        }

        .header { text-align: center; margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; }

        .header h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 4.8rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 6px;
            line-height: 1;
            margin-left: 6px;
            text-shadow: 
                2px 2px 0px #000,
                4px 4px 0px var(--deep-red),
                6px 6px 12px rgba(0,0,0,0.9),
                0 0 10px #fff,
                0 0 25px var(--blood-red),
                0 0 50px var(--blood-red);
            animation: neonBreathing 4s infinite alternate ease-in-out;
        }

        .header .subtitle {
            font-family: 'Russo One', sans-serif;
            font-size: 1.6rem;
            color: var(--dirty-yellow);
            letter-spacing: 5px;
            text-transform: uppercase;
            background: #000000;
            padding: 4px 22px;
            border: 2px solid var(--dirty-yellow);
            box-shadow: 0 0 15px rgba(255, 183, 0, 0.4);
            display: inline-block;
            margin-top: 12px;
            transform: rotate(1deg);
        }

        @keyframes neonBreathing { 0% { opacity: 1; } 100% { opacity: 0.92; } }

        .board { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 12px; position: relative; }

        .card {
            background: var(--card-bg); border: 2px solid #2a2a2a; padding: 8px 18px;
            display: grid; grid-template-columns: 70px 75px 1fr auto; align-items: center; gap: 15px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.8); transition: all 0.3s ease; position: relative;
        }
        .card:nth-child(odd) { transform: rotate(-0.4deg); }
        .card:nth-child(even) { transform: rotate(0.4deg); }

        .card.rank-1 { 
            border-color: #ffaa00; 
            background: linear-gradient(135deg, #3a1200 0%, #1a0800 50%, #0d0d0d 100%);
            animation: fireGlow 1.2s infinite alternate ease-in-out;
        }
        @keyframes fireGlow {
            0% { box-shadow: 0 0 12px rgba(255, 85, 0, 0.8); border-color: #ff3300; }
            100% { box-shadow: 0 0 22px rgba(255, 170, 0, 1); border-color: #ffaa00; }
        }

        .rank { font-size: 2.2rem; color: #666; }

        .avatar-box {
            width: 68px; 
            height: 68px; 
            border-radius: 50%;
            border: 3px solid var(--dirty-yellow); 
            overflow: hidden;
            background: #111; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            box-shadow: 0 0 12px rgba(255, 183, 0, 0.3), 0 0 5px rgba(0,0,0,0.9);
            flex-shrink: 0;
        }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-placeholder { font-size: 2.4rem; color: #666; }

        .name { font-size: 2.4rem; color: #eee; }
        .battle-stats { font-size: 1.3rem; color: #ffaa00; display: flex; gap: 10px; }
        .score-box { text-align: right; background: #000; padding: 4px 14px; border: 1px dashed #444; }
        .score { font-size: 2.8rem; color: var(--blood-red); line-height: 1; }
        .unit { font-size: 1.3rem; color: #777; }

        #projectiles-layer { position: fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:9999; }

        .projectile {
            position: absolute; font-size: 3.5rem; transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .splat-mark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 4rem; pointer-events: none; z-index: 50; animation: splatFade 3s forwards;
        }

        @keyframes splatFade {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
            20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
        }

        #tv-chat-container {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 800px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; z-index: 8000;
        }
        .chat-bubble {
            background: rgba(18, 12, 12, 0.95); border: 2px solid var(--dirty-yellow);
            border-radius: 10px; padding: 10px 20px; display: flex; align-items: center; gap: 12px;
        }
        .chat-sender { font-size: 1.8rem; color: var(--dirty-yellow); background: #000; padding: 2px 10px; }
        .chat-text { font-size: 2rem; color: #fff; }

        #battle-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 2, 2, 0.94); backdrop-filter: blur(8px);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; padding: 20px;
        }

        .battle-card {
            background: #111; border: 3px solid var(--blood-red);
            border-radius: 12px; padding: 30px 45px; max-width: 800px; width: 90%; text-align: center;
            display: flex; flex-direction: column; align-items: center;
        }

        .battle-badge { background: var(--blood-red); color: #fff; font-size: 2.2rem; padding: 4px 25px; border-radius: 6px; margin-bottom: 18px; }

        .ttt-grid {
            display: grid; grid-template-columns: repeat(3, 95px); grid-template-rows: repeat(3, 95px);
            gap: 12px; margin: 15px 0; background: var(--dirty-yellow); padding: 12px; border-radius: 10px;
        }

        .ttt-cell {
            background: #000; border: 2px solid #333; display: flex; align-items: center;
            justify-content: center; font-size: 3.8rem; color: #fff;
        }

        .battle-status-box { background: #000; border: 2px dashed var(--dirty-yellow); padding: 8px 25px; border-radius: 6px; }
        .battle-status-text { font-size: 2.2rem; color: var(--dirty-yellow); }
    </style>
</head>
<body>

    <div class="header">
        <h1>НА ДНЕ</h1>
        <div class="subtitle">Minsk Shot Bar</div>
    </div>

    <div class="board" id="board"></div>

    <div id="projectiles-layer"></div>
    <div id="tv-chat-container"></div>

    <div id="battle-overlay">
        <div class="battle-card" id="b-card">
            <div class="battle-badge" id="b-badge">❌⭕ КРЕСТИКИ-НОЛИКИ ❌⭕</div>
            
            <div id="b-vs-box" style="display:flex; gap:20px; font-size:2.5rem; margin-bottom:12px;">
                <span id="p1-name" style="color:var(--blood-red)">ИГРОК 1 (❌)</span>
                <span>VS</span>
                <span id="p2-name" style="color:var(--dirty-yellow)">ИГРОК 2 (⭕)</span>
            </div>

            <div class="ttt-grid" id="ttt-grid" style="display: none;">
                <div class="ttt-cell" id="c0"></div><div class="ttt-cell" id="c1"></div><div class="ttt-cell" id="c2"></div>
                <div class="ttt-cell" id="c3"></div><div class="ttt-cell" id="c4"></div><div class="ttt-cell" id="c5"></div>
                <div class="ttt-cell" id="c6"></div><div class="ttt-cell" id="c7"></div><div class="ttt-cell" id="c8"></div>
            </div>

            <div class="battle-status-box">
                <div class="battle-status-text" id="b-status">ЖДЕМ ХОДА...</div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const board = document.getElementById('board');
        const overlay = document.getElementById('battle-overlay');
        const bBadge = document.getElementById('b-badge');
        const p1Name = document.getElementById('p1-name');
        const p2Name = document.getElementById('p2-name');
        const tttGrid = document.getElementById('ttt-grid');
        const bStatus = document.getElementById('b-status');
        const chatContainer = document.getElementById('tv-chat-container');
        const projLayer = document.getElementById('projectiles-layer');

        let countdownInterval = null;

        function startCountdown(seconds) {
            clearInterval(countdownInterval);
            let timeLeft = seconds;
            
            countdownInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft >= 0) {
                    const statusText = bStatus.innerText.split('(')[0];
                    bStatus.innerText = `${statusText} (${timeLeft} СЕК)`;
                } else {
                    clearInterval(countdownInterval);
                }
            }, 1000);
        }

        async function updateLeaderboard() {
            try {
                const res = await fetch('/api/leaderboard');
                const guests = await res.json();

                guests.forEach((guest, index) => {
                    const rank = index + 1;
                    let card = document.getElementById(`guest-${guest.id}`);

                    const bombsCount = guest.bombs || 0;
                    const winsCount = guest.wins || 0;
                    const battleBadge = (bombsCount > 0 || winsCount > 0)
                        ? `💣 ${bombsCount} | 👑 ${winsCount} ПОБЕД`
                        : '';

                    const rankDisplay = rank === 1 ? '🔥 #1' : `#${rank}`;
                    const avatarHtml = guest.avatar_url 
                        ? `<img src="${guest.avatar_url}" class="avatar-img" alt="avatar" />`
                        : `<div class="avatar-placeholder">👤</div>`;

                    if (!card) {
                        card = document.createElement('div');
                        card.id = `guest-${guest.id}`;
                        card.className = `card rank-${rank <= 3 ? rank : 'other'}`;
                        card.innerHTML = `
                            <div class="rank">${rankDisplay}</div>
                            <div class="avatar-box" id="avatar-${guest.id}">${avatarHtml}</div>
                            <div class="name-container">
                                <div class="name">${guest.name}</div>
                                <div class="battle-stats" id="b-stats-${guest.id}">${battleBadge}</div>
                            </div>
                            <div class="score-box">
                                <span class="score" id="score-${guest.id}">${guest.count}</span>
                                <span class="unit">ШОТОВ</span>
                            </div>
                        `;
                        board.appendChild(card);
                    } else {
                        document.getElementById(`score-${guest.id}`).innerText = guest.count;
                        document.getElementById(`b-stats-${guest.id}`).innerText = battleBadge;
                        document.getElementById(`avatar-${guest.id}`).innerHTML = avatarHtml;
                    }

                    card.className = `card rank-${rank <= 3 ? rank : 'other'}`;
                    card.querySelector('.rank').innerText = rankDisplay;
                    board.appendChild(card);
                });
            } catch (e) { console.error(e); }
        }

        updateLeaderboard();
        socket.on('update_board', updateLeaderboard);

        socket.on('throw_reaction', (data) => {
            if (projLayer.children.length > 8) projLayer.removeChild(projLayer.children[0]);

            const targetCard = document.getElementById(`guest-${data.targetId}`);
            let senderCard = data.senderId ? document.getElementById(`guest-${data.senderId}`) : null;

            const targetRect = targetCard ? targetCard.getBoundingClientRect() : { left: window.innerWidth / 2, top: 200 };
            const startX = senderCard ? senderCard.getBoundingClientRect().left + 40 : window.innerWidth / 2;
            const startY = senderCard ? senderCard.getBoundingClientRect().top + 15 : window.innerHeight - 80;

            const endX = targetRect.left + (targetRect.width / 2);
            const endY = targetRect.top + (targetRect.height / 2);

            const proj = document.createElement('div');
            proj.className = 'projectile';
            proj.innerText = data.item;
            proj.style.left = `${startX}px`;
            proj.style.top = `${startY}px`;
            projLayer.appendChild(proj);

            setTimeout(() => {
                proj.style.left = `${endX}px`;
                proj.style.top = `${endY}px`;
                proj.style.transform = 'scale(1.5) rotate(360deg)';
            }, 30);

            setTimeout(() => {
                proj.remove();
                if (targetCard) {
                    if (targetCard.children.length > 5) return;
                    const splat = document.createElement('div');
                    splat.className = 'splat-mark';
                    splat.innerText = data.item === '🍅' ? '💥🍅' : data.item === '💵' ? '💸' : data.item;
                    targetCard.appendChild(splat);
                    setTimeout(() => splat.remove(), 3000);
                }
            }, 800);
        });

        socket.on('tv_chat_message', (data) => {
            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble';
            bubble.innerHTML = `<div class="chat-sender">💬 ${data.sender}:</div><div class="chat-text">${data.text}</div>`;
            chatContainer.appendChild(bubble);
            if (chatContainer.children.length > 3) chatContainer.removeChild(chatContainer.children[0]);
            setTimeout(() => bubble.remove(), 10000);
        });

        socket.on('ttt_announced', (data) => {
            tttGrid.style.display = "none";
            bBadge.innerText = "❌⭕ ВЫЗОВ В КРЕСТИКИ-НОЛИКИ ❌⭕";
            p1Name.innerText = `${data.challengerName} (❌)`;
            p2Name.innerText = `${data.targetName} (⭕)`;
            bStatus.innerText = "ОЖИДАНИЕ (5 СЕК)";
            overlay.style.display = 'flex';
            startCountdown(5);
        });

        socket.on('ttt_started', (game) => {
            clearInterval(countdownInterval);
            tttGrid.style.display = "grid";
            bBadge.innerText = "⚔️ ИГРА В РАЗГАРЕ! ⚔️";
            p1Name.innerText = `${game.playerX.name} (❌)`;
            p2Name.innerText = `${game.playerO.name} (⭕)`;
            updateTTTBoard(game.board);
            bStatus.innerText = `ХОДИТ: ${game.playerX.name} (❌)`;
        });

        socket.on('ttt_update', (game) => {
            updateTTTBoard(game.board);
            const currentName = game.turn === 'X' ? game.playerX.name : game.playerO.name;
            const currentSymbol = game.turn === 'X' ? '❌' : '⭕';
            bStatus.innerText = `ХОДИТ: ${currentName} (${currentSymbol})`;
        });

        socket.on('ttt_ended', (data) => {
            if (data.draw) {
                bStatus.innerText = "🤝 НИЧЬЯ В КРЕСТИКАХ-НОЛИКАХ!";
            } else {
                bStatus.innerText = `👑 ПОБЕДИТЕЛЬ: ${data.winnerName}! (+1 ПОБЕДА)`;
            }
            setTimeout(() => { overlay.style.display = 'none'; }, 5000);
        });

        function updateTTTBoard(boardArray) {
            boardArray.forEach((val, i) => {
                const cell = document.getElementById(`c${i}`);
                cell.innerText = val === 'X' ? '❌' : val === 'O' ? '⭕' : '';
            });
        }

        socket.on('battle_announced', (data) => {
            tttGrid.style.display = "none";
            bBadge.innerText = "💣 ВЫЗОВ НА БАТТЛ «БОМБА» 💣";
            p1Name.innerText = data.challengerName;
            p2Name.innerText = data.targetName;
            bStatus.innerText = "ОЖИДАНИЕ (5 СЕК)";
            overlay.style.display = 'flex';
            startCountdown(5);
        });

        socket.on('battle_accepted', () => { 
            clearInterval(countdownInterval);
            bStatus.innerText = "БАРМЕН, ГОТОВЬ БОМБЫ! ВСЕ К СТОЙКЕ!"; 
        });

        socket.on('battle_declined', () => { 
            clearInterval(countdownInterval);
            bStatus.innerText = "ВЫЗОВ ОТКЛОНЁН!"; 
            setTimeout(() => overlay.style.display = 'none', 2500); 
        });

        socket.on('battle_timeout', () => {
            clearInterval(countdownInterval);
            bStatus.innerText = "⏱ ВРЕМЯ ИСТЕКЛО!";
            setTimeout(() => overlay.style.display = 'none', 2500);
        });

        socket.on('battle_winner_announcement', (data) => {
            bStatus.innerText = `👑 ПОБЕДИТЕЛЬ: ${data.winnerName}!`;
            setTimeout(() => overlay.style.display = 'none', 5000);
        });
    </script>
</body>
</html>
