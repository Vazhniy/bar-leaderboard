<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Табло бара НА ДНЕ</title>
    <script src="/socket.io/socket.io.js"></script>
    <!-- Подключаем гранжевые и ретро шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0808;
            --blood-red: #d11100;
            --dirty-yellow: #e5a910;
            --tape-gray: #2a2a2a;
            --text-light: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            /* Имитация красного освещения и грязной текстуры стены */
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(209, 17, 0, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 10% 80%, rgba(229, 169, 16, 0.05) 0%, transparent 40%);
            color: var(--text-light);
            font-family: 'Permanent Marker', cursive;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 60px;
            overflow: hidden;
            position: relative;
        }

        /* Эффект шума (статики) как на старых ТВ из 90-х */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.06;
            pointer-events: none;
            z-index: -1;
        }

        /* Сломанная неоновая вывеска */
        .header {
            text-align: center;
            margin-bottom: 50px;
            transform: rotate(-2deg);
        }

        .header h1 {
            font-size: 6rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 
                0 0 10px var(--blood-red),
                0 0 20px var(--blood-red),
                0 0 40px var(--blood-red),
                3px 3px 0px #000;
            animation: neonFlicker 3s infinite alternate;
        }

        .header .subtitle {
            font-family: 'VT323', monospace;
            font-size: 2rem;
            color: var(--dirty-yellow);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: -10px;
            background: #000;
            display: inline-block;
            padding: 0 15px;
            transform: rotate(3deg);
            border: 1px solid var(--dirty-yellow);
        }

        @keyframes neonFlicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                text-shadow: 0 0 10px var(--blood-red), 0 0 20px var(--blood-red), 0 0 40px var(--blood-red), 3px 3px 0px #000;
                color: #fff;
            }
            20%, 24%, 55% {
                text-shadow: none;
                color: #330000;
            }
        }

        .board {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Треш-карточки гостей */
        .card {
            background: #151515;
            border: 3px solid #333;
            padding: 15px 30px;
            display: grid;
            grid-template-columns: 80px 1fr 180px;
            align-items: center;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.8);
            position: relative;
            transition: all 0.3s ease;
        }

        /* Делаем карточки небрежно разбросанными */
        .card:nth-child(odd) { transform: rotate(-1.5deg); }
        .card:nth-child(even) { transform: rotate(1.5deg); }

        /* Имитация кусков изоленты/скотча */
        .card::before {
            content: '';
            position: absolute;
            top: -10px; left: 20px;
            width: 60px; height: 25px;
            background: rgba(255,255,255,0.1);
            transform: rotate(-5deg);
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(2px);
        }

        /* Топ-3: Грубый уличный стиль */
        .card.rank-1 { 
            border-color: var(--dirty-yellow); 
            background: #2a1f00;
            box-shadow: 10px 10px 0px #000, 0 0 20px rgba(229, 169, 16, 0.2);
        }
        .card.rank-1 .rank { color: var(--dirty-yellow); }

        .card.rank-2 { 
            border-color: #888; 
            background: #1a1a1a;
        }
        .card.rank-2 .rank { color: #aaa; }

        .card.rank-3 { 
            border-color: #8b5a2b; 
            background: #201308;
        }
        .card.rank-3 .rank { color: #cd7f32; }

        .rank {
            font-size: 3rem;
            color: #555;
            text-shadow: 2px 2px 0 #000;
        }

        .name {
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: #eee;
            text-shadow: 2px 2px 0 #000;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .score-box {
            text-align: right;
            background: #000;
            padding: 10px;
            border: 2px dashed #444;
            transform: rotate(2deg);
        }

        /* Счетчик в стиле ретро-электроники 90-х */
        .score {
            font-family: 'VT323', monospace;
            font-size: 3.5rem;
            color: var(--blood-red);
            text-shadow: 0 0 10px var(--blood-red);
            display: inline-block;
        }

        .unit {
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            color: #777;
            margin-left: 5px;
        }

        /* Грязный глитч при добавлении шота */
        @keyframes trashBump {
            0% { transform: scale(1) translate(0, 0); }
            20% { transform: scale(1.4) translate(-3px, 3px); color: #fff; text-shadow: -3px 0 red, 3px 0 blue; }
            40% { transform: scale(1.4) translate(3px, -3px); color: #fff; text-shadow: 3px 0 red, -3px 0 blue; }
            60% { transform: scale(1.4) translate(-3px, -3px); color: var(--blood-red); text-shadow: 0 0 30px var(--blood-red); }
            100% { transform: scale(1) translate(0, 0); }
        }
        .pulse { animation: trashBump 0.4s steps(2, end); }
    </style>
</head>
<body>

    <div class="header">
        <h1>НА ДНЕ</h1>
        <div class="subtitle">Minsk Shot Bar</div>
    </div>

    <div class="board" id="board">
        <!-- Список заполняется автоматически -->
    </div>

    <script>
        const socket = io();
        const board = document.getElementById('board');

        async function updateLeaderboard() {
            try {
                const res = await fetch('/api/leaderboard');
                const guests = await res.json();

                guests.forEach((guest, index) => {
                    const rank = index + 1;
                    let card = document.getElementById(`guest-${guest.id}`);

                    if (!card) {
                        card = document.createElement('div');
                        card.id = `guest-${guest.id}`;
                        card.className = `card rank-${rank <= 3 ? rank : 'other'}`;
                        card.innerHTML = `
                            <div class="rank">#${rank}</div>
                            <div class="name">${guest.name}</div>
                            <div class="score-box">
                                <span class="score" id="score-${guest.id}">${guest.count}</span>
                                <span class="unit">ШОТОВ</span>
                            </div>
                        `;
                        board.appendChild(card);
                    } else {
                        const scoreEl = document.getElementById(`score-${guest.id}`);
                        if (parseInt(scoreEl.innerText) !== guest.count) {
                            scoreEl.innerText = guest.count;
                            scoreEl.classList.remove('pulse');
                            void scoreEl.offsetWidth; // перезапуск анимации
                            scoreEl.classList.add('pulse');
                        }
                    }

                    // Обновление ранга
                    card.className = `card rank-${rank <= 3 ? rank : 'other'}`;
                    card.querySelector('.rank').innerText = `#${rank}`;
                    board.appendChild(card);
                });

                // Удаляем тех, кого сбросили
                const currentIds = guests.map(g => `guest-${g.id}`);
                Array.from(board.children).forEach(child => {
                    if (!currentIds.includes(child.id)) child.remove();
                });

            } catch (e) {
                console.error("Ошибка загрузки:", e);
            }
        }

        updateLeaderboard();

        socket.on('update_board', () => {
            updateLeaderboard();
        });
    </script>
</body>
</html>
